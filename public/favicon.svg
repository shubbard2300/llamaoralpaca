  <path d="M68 78 C50 52, 50 20, 70 26 C80 38, 78 62, 74 82 Z" fill="#3d4a63" />
  <path d="M132 78 C150 52, 150 20, 130 26 C120 38, 122 62, 126 82 Z" fill="#7a5a3a" />

